<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الحلاقة للرجال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14202e;--red:#c8372d;--bg:#f1f3f4;--card:#fff;--mut:#5c6874;--line:#d5dade}
@media (prefers-color-scheme:dark){:root{--ink:#eef1f3;--bg:#0f1822;--card:#16222f;--mut:#9aa7b3;--line:#2b3a4a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.6}
.pole{height:12px;background:repeating-linear-gradient(-45deg,var(--red) 0 14px,#fff 14px 28px,#1f4e8c 28px 42px)}
.w{max-width:540px;margin:0 auto;padding:18px 16px calc(40px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.01em}
.lang{font:inherit;background:none;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 12px;cursor:pointer}
.sub{color:var(--mut);margin:2px 0 22px}
section{border-top:2px solid var(--ink);padding:14px 0 18px}
h2{margin:0 0 10px;font-size:17px;font-weight:800}
.g{display:grid;gap:8px}.g2{grid-template-columns:1fr}.g4{grid-template-columns:repeat(4,1fr)}
.o{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 6px;cursor:pointer;text-align:center}
.o:focus-visible,.go:focus-visible,input:focus-visible,.lang:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.o.on{background:var(--ink);color:var(--bg);border-color:var(--ink);box-shadow:inset 0 -4px 0 var(--red)}
.o:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.sv{display:flex;justify-content:space-between;padding:12px 14px}
input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:11px;width:100%;margin-bottom:8px}
.go{font:inherit;font-weight:800;background:var(--red);color:#fff;border:0;border-radius:6px;padding:14px;width:100%;cursor:pointer}
.go:disabled{opacity:.45;cursor:not-allowed}
.err{color:var(--red);font-weight:600;margin:8px 0 0}
.done{border-top:2px solid var(--ink);padding-top:18px}
.done h2{font-size:24px}
.done b{font-size:20px}
@media (prefers-reduced-motion:no-preference){.done{animation:in .35s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>
<body>
<div class="pole"></div>
<div class="w"><div class="top"><h1 id="ttl"></h1><button class="lang" id="lg"></button></div><p class="sub" id="sb"></p><div id="app"></div></div>
<script>
const T={
ar:{t:"الحلاقة للرجال",sub:"احجز موعدك أونلاين. كل يوم من 7 إلى 9 مساءً.",s1:"اختر الخدمة",s2:"اختر اليوم",s3:"اختر الوقت",s4:"بياناتك",hair:"قص شعر",beard:"حلاقة ذقن",both:"قص شعر + حلاقة ذقن",m15:"15 دقيقة",m30:"30 دقيقة",nm:"الاسم",ph:"رقم الهاتف",go:"احجز الموعد",busy:"جارٍ الحجز...",ok:"تم حجز موعدك",again:"حجز موعد آخر",taken:"هذا الوقت حُجز للتو. اختر وقتاً آخر.",fail:"تعذّر الحجز. حاول مرة أخرى.",other:"Türkçe",loc:"ar",dir:"rtl"},
tr:{t:"Erkek Berberi",sub:"Online randevu alın. Her gün 19:00 - 21:00.",s1:"Hizmet seçin",s2:"Gün seçin",s3:"Saat seçin",s4:"Bilgileriniz",hair:"Saç kesimi",beard:"Sakal tıraşı",both:"Saç kesimi + sakal tıraşı",m15:"15 dk",m30:"30 dk",nm:"Ad Soyad",ph:"Telefon numarası",go:"Randevu al",busy:"Kaydediliyor...",ok:"Randevunuz alındı",again:"Başka randevu al",taken:"Bu saat az önce alındı. Başka bir saat seçin.",fail:"Randevu alınamadı. Tekrar deneyin.",other:"العربية",loc:"tr",dir:"ltr"}};
const SV=[["hair",1],["beard",1],["both",2]];
const SLOTS=["19:00","19:15","19:30","19:45","20:00","20:15","20:30","20:45"];
let L="ar";try{L=localStorage.getItem("l")||"ar"}catch(e){}
const IST=()=>new Date().toLocaleString("sv-SE",{timeZone:"Europe/Istanbul"});
const add=(d,n)=>{const x=new Date(d+"T12:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const days=[...Array(7)].map((_,i)=>add(IST().slice(0,10),i));
const fmt=(d,o)=>new Date(d+"T12:00:00Z").toLocaleDateString(T[L].loc,{...o,timeZone:"UTC"});
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lab=t=>{if(L!=="ar")return t;const[h,m]=t.split(":");return (h-12)+":"+m+" م"};
let S,taken=new Set();
const fresh=()=>S={day:days[0],svc:null,slot:null,name:"",phone:"",busy:false,done:null,err:""};fresh();
const need=()=>S.svc?SV.find(x=>x[0]===S.svc)[1]:1;
function free(i){const n=need(),now=IST();for(let k=0;k<n;k++){const t=SLOTS[i+k];if(!t||taken.has(t)||S.day+" "+t+":00"<=now)return false}return true}
async function load(){try{const r=await fetch("/.netlify/functions/slots?day="+S.day);taken=new Set(r.ok?await r.json():[])}catch(e){taken=new Set()}render()}
const ready=()=>S.svc&&S.slot&&S.name.trim()&&S.phone.trim()&&!S.busy;
function render(){
  const t=T[L],a=document.getElementById("app");
  document.documentElement.lang=L;document.documentElement.dir=t.dir;document.title=t.t;
  document.getElementById("ttl").textContent=t.t;document.getElementById("sb").textContent=t.sub;document.getElementById("lg").textContent=t.other;
  if(S.done){a.innerHTML='<div class="done"><h2>'+t.ok+'</h2><p><b>'+fmt(S.done.day,{weekday:"long",day:"numeric",month:"long"})+' · '+lab(S.done.slot)+'</b><br>'+t[S.done.svc]+' — '+esc(S.done.name)+'</p><button class="o" id="again">'+t.again+'</button></div>';document.getElementById("again").onclick=()=>{fresh();load()};return}
  a.innerHTML=
  '<section><h2>'+t.s1+'</h2><div class="g g2">'+SV.map(([id,n])=>'<button class="o sv'+(S.svc===id?' on':'')+'" data-s="'+id+'"><span>'+t[id]+'</span><span>'+t["m"+n*15]+'</span></button>').join("")+'</div></section>'+
  '<section><h2>'+t.s2+'</h2><div class="g g4">'+days.map(d=>'<button class="o'+(S.day===d?' on':'')+'" data-d="'+d+'">'+fmt(d,{weekday:"short"})+'<br>'+fmt(d,{day:"numeric",month:"numeric"})+'</button>').join("")+'</div></section>'+
  '<section><h2>'+t.s3+'</h2><div class="g g4">'+SLOTS.map((s,i)=>'<button class="o'+(S.slot===s?' on':'')+'" data-t="'+s+'"'+(free(i)?'':' disabled')+'>'+lab(s)+'</button>').join("")+'</div></section>'+
  '<section><h2>'+t.s4+'</h2><input id="nm" autocomplete="name" placeholder="'+t.nm+'" value="'+esc(S.name)+'"><input id="ph" type="tel" inputmode="tel" autocomplete="tel" placeholder="'+t.ph+'" value="'+esc(S.phone)+'"><button class="go" id="bk"'+(ready()?'':' disabled')+'>'+(S.busy?t.busy:t.go)+'</button>'+(S.err?'<p class="err" role="alert">'+t[S.err]+'</p>':'')+'</section>';
  a.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{S.svc=b.dataset.s;S.slot=null;render()});
  a.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{S.day=b.dataset.d;S.slot=null;S.err="";load()});
  a.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{S.slot=b.dataset.t;render()});
  const up=()=>document.getElementById("bk").disabled=!ready();
  nm.oninput=e=>{S.name=e.target.value;up()};ph.oninput=e=>{S.phone=e.target.value;up()};
  bk.onclick=book;
}
async function book(){
  S.busy=true;S.err="";render();
  try{
    const r=await fetch("/.netlify/functions/book",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:S.name,phone:S.phone,service:S.svc,day:S.day,slot:S.slot})});
    if(r.ok){S.done={day:S.day,slot:S.slot,svc:S.svc,name:S.name.trim()};S.busy=false;return render()}
    S.err=r.status===409?"taken":"fail";
  }catch(e){S.err="fail"}
  S.busy=false;S.slot=null;load();
}
document.getElementById("lg").onclick=()=>{L=L==="ar"?"tr":"ar";try{localStorage.setItem("l",L)}catch(e){}render()};
load();
</script>
</body>
</html>
